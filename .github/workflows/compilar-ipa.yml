# Compila la app en una Mac de GitHub (gratis en repos públicos) y publica
# CuentasStreaming.ipa sin firmar en Releases. SideStore la firma con tu Apple ID al instalarla.
name: Compilar IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-ipa
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: macos-15
    env:
      VERSION: "1.0.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild build \
            -project StreamingApp.xcodeproj \
            -target StreamingApp \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/StreamingApp.app

      - name: Mostrar errores
        if: failure()
        run: grep -E "error:" -A3 build.log | head -200

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/StreamingApp.app Payload/
          zip -qry CuentasStreaming.ipa Payload
          ls -lh CuentasStreaming.ipa

      - name: Fuente para SideStore
        run: |
          TAMANO=$(stat -f%z CuentasStreaming.ipa)
          FECHA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO="${{ github.repository }}"
          cat > source.json <<EOF
          {
            "name": "Cuentas Streaming",
            "identifier": "com.mastercloud06.cuentasstreaming.source",
            "subtitle": "Administrador de cuentas de streaming",
            "iconURL": "https://raw.githubusercontent.com/${REPO}/main/icono.png",
            "website": "https://github.com/${REPO}",
            "apps": [
              {
                "name": "Cuentas Streaming",
                "bundleIdentifier": "com.mastercloud06.cuentasstreaming",
                "developerName": "MasterCloud06",
                "subtitle": "Perfiles, vencimientos y dispositivos",
                "localizedDescription": "Administra cuentas de streaming, perfiles, vencimientos y dispositivos sin internet.",
                "iconURL": "https://raw.githubusercontent.com/${REPO}/main/icono.png",
                "tintColor": "D91F61",
                "versions": [
                  {
                    "version": "${VERSION}",
                    "buildVersion": "${{ github.run_number }}",
                    "date": "${FECHA}",
                    "downloadURL": "https://github.com/${REPO}/releases/download/v${VERSION}/CuentasStreaming.ipa",
                    "size": ${TAMANO},
                    "minOSVersion": "17.0"
                  }
                ],
                "appPermissions": { "entitlements": [], "privacy": {} }
              }
            ],
            "news": []
          }
          EOF
          cat source.json

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CAMBIOS: ${{ github.event.head_commit.message || 'Compilación manual' }}
        run: |
          printf 'Instala CuentasStreaming.ipa con SideStore.\n\n%s\n' "$CAMBIOS" > notas.md
          gh release create "v$VERSION" CuentasStreaming.ipa source.json \
            --title "Cuentas Streaming $VERSION" --notes-file notas.md --latest

      - uses: actions/upload-artifact@v4
        with:
          name: CuentasStreaming-${{ env.VERSION }}
          path: CuentasStreaming.ipa
